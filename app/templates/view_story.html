{% extends "base.html" %}

{% block title %}
Diary - DriftBridge
{% endblock %}

{% block content %}

<div class="diary-view-container">

    <article class="diary-view-card">

        <!-- Diary Header -->
        <div class="diary-view-header">

            <a
                href="{{ url_for('story.user_stories', user_id=story.user_id) }}"
                class="diary-view-author"
            >

                <div class="avatar avatar-primary">
                    {{ story.author.username[0]|upper }}
                </div>

                <div class="diary-view-author-info">

                    <strong>
                        {{ story.author.username }}
                    </strong>

                    <span>
                        {{ story.created_at.strftime("%B %d, %Y") }}
                    </span>

                </div>

            </a>


            <!-- Diary Menu -->
            <button
                type="button"
                class="diary-view-menu"
                aria-label="Diary options"
                title="Diary options"
            >
                ⋮
            </button>

        </div>


        <!-- Diary Content -->
        <div
            class="diary-view-content"
            style="background: {{ story.background_color or '#1a4380' }};"
        >

            <div class="diary-view-text">
                {{ story.text_content }}
            </div>

        </div>


        <!-- Diary Actions -->
        <div class="diary-view-actions">

            <button
                type="button"
                class="diary-view-action"
                disabled
                title="Like"
            >
                ♥
            </button>

            <button
                type="button"
                class="diary-view-action"
                disabled
                title="Comment"
            >
                💬
            </button>

            <button
                type="button"
                class="diary-view-action"
                disabled
                title="Share"
            >
                ↗
            </button>

        </div>

    </article>


    <!-- Close / Back -->
    <div class="diary-view-close">

        <a
            href="{{ url_for('story.feed') }}"
            class="diary-close-button"
            aria-label="Back to Diary Feed"
            title="Back to Diary Feed"
        >
            &times;
        </a>

    </div>

</div>

{% endblock %}

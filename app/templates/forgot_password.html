{% extends "base.html" %}

{% block title %}Forgot Password — DriftBridge{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-header">

        <svg
            width="56"
            height="56"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="margin-bottom: 12px;"
        >
            <rect
                x="16"
                y="28"
                width="32"
                height="24"
                rx="5"
                stroke="#2b7de9"
                stroke-width="4"
            />

            <path
                d="M22 28V22C22 16.477 26.477 12 32 12C37.523 12 42 16.477 42 22V28"
                stroke="#2dd4bf"
                stroke-width="4"
                stroke-linecap="round"
            />

            <circle
                cx="32"
                cy="39"
                r="3"
                fill="#2b7de9"
            />

            <path
                d="M32 42V46"
                stroke="#2b7de9"
                stroke-width="4"
                stroke-linecap="round"
            />
        </svg>

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll send you a verification code.
        </p>

    </div>


    <div class="card">

        <form
            method="POST"
            action="{{ url_for('auth.forgot_password') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="form-group">

                <label
                    class="form-label"
                    for="email"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your account email"
                    autocomplete="email"
                    required
                    autofocus
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block"
                style="margin-top: 8px;"
            >
                Send Verification Code
            </button>

        </form>

    </div>


    <p class="auth-footer">
        Remember your password?
        <a href="{{ url_for('auth.login') }}">
            Back to Login
        </a>
    </p>

</div>

{% endblock %}

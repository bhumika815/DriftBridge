{% extends "base.html" %}

{% block title %}
Throw a Bottle - DriftBridge
{% endblock %}

{% block content %}

<style>
    .container {
        max-width: 700px;
        margin: 50px auto;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-top: 0;
    }

    .description {
        color: #666;
        line-height: 1.6;
    }

    textarea {
        width: 100%;
        min-height: 180px;
        padding: 15px;
        margin-top: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        resize: vertical;
        font-family: Arial, sans-serif;
        font-size: 15px;
    }

    textarea:focus {
        outline: none;
        border-color: #555;
    }

    button {
        margin-top: 20px;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: #222;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }
</style>


<main class="container">

    <div class="card">

        <h1>Throw a Bottle</h1>

        <p class="description">
            Write a message and throw your bottle into the DriftBridge pool.
            Another person can keep the bottle and start a connection with you.
        </p>


        <form method="POST">

            <textarea
                name="message"
                placeholder="Write your message here..."
                maxlength="1000"
                required
            ></textarea>

            <button type="submit">
                Throw Bottle
            </button>

        </form>

    </div>

</main>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Throw a Bottle - DriftBridge
{% endblock %}

{% block content %}

<div class="throw-container">

    <div class="throw-card">

        <h1>Throw a Bottle</h1>

        <p class="throw-description">
            Write a message and throw your bottle into the DriftBridge pool.
            Another person can keep the bottle and start a connection with you.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="message">Your Message</label>
                <textarea
                    class="form-control"
                    name="message"
                    id="message"
                    placeholder="Write your message here..."
                    maxlength="1000"
                    required
                    style="min-height: 180px;"
                ></textarea>
                <small class="form-hint">Max 1000 characters</small>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">
                Throw Bottle
            </button>

        </form>

    </div>

</div>

{% endblock %}

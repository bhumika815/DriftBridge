{% extends "base.html" %}

{% block title %}Page Not Found — DriftBridge{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 80px auto; text-align: center;">
    <h1 style="font-size: 48px; color: var(--neutral-400);">404</h1>
    <h2>Page Not Found</h2>
    <p style="color: var(--neutral-500); margin-top: 12px;">
        The page you're looking for doesn't exist or may have been moved.
    </p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary" style="margin-top: 24px;">
        Back to Dashboard
    </a>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Reset Password — DriftBridge{% endblock %}

{% block content %}

<div style="max-width: 420px; margin: 48px auto; padding: 0 16px;">

    <div style="text-align: center; margin-bottom: 32px;">

        <svg
            width="56"
            height="56"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="margin-bottom: 12px;"
        >
            <rect
                x="16"
                y="28"
                width="32"
                height="24"
                rx="5"
                stroke="#2b7de9"
                stroke-width="4"
            />

            <path
                d="M22 28V22C22 16.477 26.477 12 32 12C37.523 12 42 16.477 42 22V28"
                stroke="#2dd4bf"
                stroke-width="4"
                stroke-linecap="round"
            />

            <path
                d="M27 40L31 44L38 36"
                stroke="#2b7de9"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>

        <h1>Set New Password</h1>

        <p style="color: var(--neutral-500); margin-top: 4px;">
            Create a new password for your DriftBridge account.
        </p>

    </div>


    <div class="card">

        <form
            method="POST"
            action="{{ url_for('auth.reset_password') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="new_password"
                >
                    New Password
                </label>

                <div style="position: relative;">

                    <input
                        type="password"
                        class="form-control"
                        id="new_password"
                        name="new_password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('new_password', this)"
                        aria-label="Show password"
                        style="
                            position: absolute;
                            right: 8px;
                            top: 50%;
                            transform: translateY(-50%);
                            background: none;
                            border: none;
                            cursor: pointer;
                            color: var(--neutral-400);
                            font-size: 14px;
                        "
                    >
                        Show
                    </button>

                </div>

                <small
                    style="
                        display: block;
                        margin-top: 6px;
                        color: var(--neutral-500);
                    "
                >
                    Password must be at least 8 characters long.
                </small>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="confirm_password"
                >
                    Confirm New Password
                </label>

                <div style="position: relative;">

                    <input
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password"
                        style="
                            position: absolute;
                            right: 8px;
                            top: 50%;
                            transform: translateY(-50%);
                            background: none;
                            border: none;
                            cursor: pointer;
                            color: var(--neutral-400);
                            font-size: 14px;
                        "
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block"
                style="margin-top: 8px;"
            >
                Reset Password
            </button>

        </form>

    </div>


    <p
        style="
            text-align: center;
            margin-top: 24px;
            color: var(--neutral-500);
        "
    >
        Remember your password?

        <a href="{{ url_for('auth.login') }}">
            Back to Login
        </a>
    </p>

</div>


<script>

function togglePassword(id, btn) {

    var input = document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        btn.textContent = "Hide";
        btn.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        input.type = "password";
        btn.textContent = "Show";
        btn.setAttribute(
            "aria-label",
            "Show password"
        );

    }
}

</script>

{% endblock %}

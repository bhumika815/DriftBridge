{% extends "base.html" %}

{% block title %}
Create Story - DriftBridge
{% endblock %}

{% block content %}

<div class="story-create-container">
    <h1>Create Story</h1>

    <div class="info-box">
        Stories disappear after 24 hours. Only your connections can see your stories.
    </div>

    <form method="POST" id="story-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="story_type" value="text">

        <!-- Story Preview -->
        <div class="story-create-preview" id="story-preview" style="background: #1a4380;">
            <div class="story-create-text" id="story-text-preview">
                Your story text will appear here...
            </div>
        </div>

        <!-- Text Content -->
        <div class="form-group">
            <label class="form-label" for="text_content">Story Text *</label>
            <textarea
                class="form-control"
                id="text_content"
                name="text_content"
                maxlength="280"
                required
                placeholder="What's on your mind?"
            ></textarea>
            <div class="character-count">
                <span id="char-count">0</span>/280 characters
            </div>
        </div>

        <!-- Background Color -->
        <div class="form-group">
            <label class="form-label">Background Color</label>
            <input type="hidden" name="background_color" id="background_color" value="#1a4380">
            <div class="color-picker">
                <div class="color-option selected" style="background: #1a4380;" data-color="#1a4380"></div>
                <div class="color-option" style="background: #e74c3c;" data-color="#e74c3c"></div>
                <div class="color-option" style="background: #2b7de9;" data-color="#2b7de9"></div>
                <div class="color-option" style="background: #14b8a6;" data-color="#14b8a6"></div>
                <div class="color-option" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                <div class="color-option" style="background: #f59e0b;" data-color="#f59e0b"></div>
                <div class="color-option" style="background: #ef4444;" data-color="#ef4444"></div>
                <div class="color-option" style="background: #0f172a;" data-color="#0f172a"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">
            Post Story
        </button>
    </form>
</div>

<script>
    const textInput = document.getElementById('text_content');
    const textPreview = document.getElementById('story-text-preview');
    const storyPreview = document.getElementById('story-preview');
    const charCount = document.getElementById('char-count');
    const bgColorInput = document.getElementById('background_color');

    textInput.addEventListener('input', function() {
        const text = this.value.trim();
        textPreview.textContent = text || 'Your story text will appear here...';
        charCount.textContent = this.value.length;
    });

    document.querySelectorAll('.color-option').forEach(option => {
        option.addEventListener('click', function() {
            const color = this.dataset.color;

            document.querySelectorAll('.color-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            this.classList.add('selected');

            storyPreview.style.background = color;
            bgColorInput.value = color;
        });
    });
</script>

{% endblock %}

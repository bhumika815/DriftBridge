{% extends "base.html" %}

{% block title %}Verify Password Reset — DriftBridge{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-header">

        <svg
            width="56"
            height="56"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="margin-bottom: 12px;"
        >
            <rect
                x="14"
                y="18"
                width="36"
                height="28"
                rx="5"
                stroke="#2b7de9"
                stroke-width="4"
            />

            <path
                d="M20 24L32 34L44 24"
                stroke="#2dd4bf"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            <circle
                cx="32"
                cy="51"
                r="3"
                fill="#2b7de9"
            />
        </svg>

        <h1>Verify Your Email</h1>

        <p>
            Enter the 6-digit verification code sent to your email address.
        </p>

    </div>


    <div class="card">

        <form
            method="POST"
            action="{{ url_for('auth.reset_password_verify', email=email) }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="form-group">

                <label
                    class="form-label"
                    for="otp"
                >
                    Verification Code
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="otp"
                    name="otp"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="Enter 6-digit code"
                    required
                    autofocus
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block"
                style="margin-top: 8px;"
            >
                Verify Code
            </button>

        </form>

    </div>


    <p class="auth-footer">
        Didn't receive the code?
        <a href="{{ url_for('auth.forgot_password') }}">
            Try again
        </a>
    </p>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Create Account — DriftBridge{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 48px auto; padding: 0 16px;">

    <div style="text-align: center; margin-bottom: 32px;">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 12px;">
            <path d="M20 38c0-6.6 5.4-12 12-12s12 5.4 12 12" stroke="#2b7de9" stroke-width="4" stroke-linecap="round"/>
            <circle cx="32" cy="24" r="5" fill="#2b7de9"/>
            <path d="M16 44h32" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h1>Join DriftBridge</h1>
        <p style="color: var(--neutral-500); margin-top: 4px;">Create your account to get started</p>
    </div>

    <div class="card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <button type="button" onclick="togglePassword('password', this)"
                            style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                                   background: none; border: none; cursor: pointer; color: var(--neutral-400); font-size: 14px;">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    <button type="button" onclick="togglePassword('confirm_password', this)"
                            style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                                   background: none; border: none; cursor: pointer; color: var(--neutral-400); font-size: 14px;">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="preferred_language">Preferred Language</label>
                <select class="form-control" id="preferred_language" name="preferred_language">
                    {% for code, name in languages|dictsort %}
                    <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
                <small class="form-hint">Messages will be automatically translated to your preferred language</small>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">Create Account</button>
        </form>
    </div>

    <p style="text-align: center; margin-top: 24px; color: var(--neutral-500);">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
</div>

<script>
function togglePassword(id, btn) {
    var input = document.getElementById(id);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
    else { input.type = 'password'; btn.textContent = 'Show'; }
}
</script>
{% endblock %}

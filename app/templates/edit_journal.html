{% extends "base.html" %}

{% block title %}
Edit Journal - DriftBridge
{% endblock %}

{% block content %}

<div class="journal-form-container">
    <h1>✏️ Edit Journal</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label" for="title">Title *</label>
            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                maxlength="200"
                required
                value="{{ journal.title }}"
                placeholder="Give your journal a meaningful title"
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="content">Content *</label>
            <textarea
                class="form-control"
                id="content"
                name="content"
                required
                style="min-height: 300px;"
                placeholder="Write your thoughts, experiences, or reflections..."
            >{{ journal.content }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="mood">Mood (Optional)</label>
            <input
                type="text"
                class="form-control"
                id="mood"
                name="mood"
                maxlength="50"
                value="{{ journal.mood or '' }}"
                placeholder="Happy, Reflective, Excited, etc."
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="tags">Tags (Optional)</label>
            <input
                type="text"
                class="form-control"
                id="tags"
                name="tags"
                maxlength="500"
                value="{{ journal.tags or '' }}"
                placeholder="travel, personal, coding, thoughts (comma-separated)"
            >
        </div>

        <div class="form-group">
            <label class="form-label">Privacy Setting *</label>
            <div class="privacy-options">

                <label class="privacy-option">
                    <input type="radio" name="privacy" value="private" {% if journal.privacy == 'private' %}checked{% endif %}>
                    <strong>🔒 Private</strong> - Only you can see this journal
                </label>

                <label class="privacy-option">
                    <input type="radio" name="privacy" value="connections" {% if journal.privacy == 'connections' %}checked{% endif %}>
                    <strong>👥 Connections</strong> - Only people you've connected with can see this
                </label>

                <label class="privacy-option">
                    <input type="radio" name="privacy" value="public" {% if journal.privacy == 'public' %}checked{% endif %}>
                    <strong>🌍 Public</strong> - Anyone on DriftBridge can see this
                </label>

            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('journal.view_journal', journal_id=journal.id) }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>

<script>
    document.querySelectorAll('.privacy-option input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.privacy-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            this.closest('.privacy-option').classList.add('selected');
        });
    });

    document.querySelector('.privacy-option input[type="radio"]:checked')
        .closest('.privacy-option').classList.add('selected');
</script>

{% endblock %}

{% extends "base.html" %}

{% block title %}
My Profile - DriftBridge
{% endblock %}

{% block content %}

<style>
    .profile-container {
        max-width: 600px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .profile-item {
        margin: 20px 0;
    }

    .profile-item strong {
        display: block;
        margin-bottom: 8px;
    }

    .profile-value {
        padding: 10px;
        background: #f1f3f3;
        border-radius: 6px;
    }

    input,
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    button {
        margin-top: 10px;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #333;
        color: white;
    }
</style>


<div class="profile-container">

    <h1>My Profile</h1>

    <div class="profile-item">
        <strong>Username</strong>

        <div class="profile-value">
            {{ user.username }}
        </div>
    </div>


    <div class="profile-item">
        <strong>Email</strong>

        <div class="profile-value">
            {{ user.email }}
        </div>
    </div>


    <form method="POST">

        <div class="profile-item">
            <strong>Bio</strong>

            <textarea
                name="bio"
                maxlength="500"
                placeholder="Tell people something about yourself..."
            >{{ user.bio or "" }}</textarea>
        </div>


        <div class="profile-item">
            <strong>Interests</strong>

            <input
                type="text"
                name="interests"
                maxlength="500"
                value="{{ user.interests or '' }}"
                placeholder="Example: Music, Coding, Travel"
            >

        </div>


        <button type="submit">
            Save Profile
        </button>

    </form>


    <div class="profile-item">
        <strong>Points</strong>

        <div class="profile-value">
            {{ user.points }}
        </div>
    </div>

</div>

{% endblock %}
